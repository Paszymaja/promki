[project]
name = "promki"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.0",
]

[project.optional-dependencies]
login = ["playwright>=1.40.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[project.scripts]
promki = "promki:main"
